<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Madura Bu Yuyun</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f7f7f7;
    color: #333;
}

header {
    background-color: #d62828;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    font-size: 24px;
}

header p {
    font-size: 14px;
    opacity: 0.9;
}

.hero {
    text-align: center;
    padding: 40px 20px;
}

.hero h2 {
    font-size: 22px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 14px;
    margin-bottom: 20px;
}

.btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: #f77f00;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
}

.products {
    padding: 30px 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    background: white;
    width: 180px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.card img {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 10px;
}

.card h3 {
    font-size: 16px;
    margin-bottom: 5px;
}

.card p {
    font-size: 14px;
    color: #d62828;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 15px;
    background-color: #eee;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>Warung Madura Bu Yuyun</h1>
    <p>Buka 24 Jam • Murah • Lengkap</p>
</header>

<section class="hero">
    <h2>Belanja Cepat Tanpa Ribet</h2>
    <p>Sembako, minuman, kebutuhan harian lengkap.</p>
    <a href="#" class="btn">Lihat Produk</a>
</section>

<section class="products">
    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Indomie">
        <h3>Indomie Goreng</h3>
        <p>Rp3.000</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Beras">
        <h3>Beras 5kg</h3>
        <p>Rp65.000</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Aqua">
        <h3>Aqua 600ml</h3>
        <p>Rp4.000</p>
    </div>
</section>

<footer>
    © 2026 Warung Madura Bu Yuyun
</footer>

</body>
</html>
