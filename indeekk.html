<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Madura Bu Yuyun</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: #f5f5f5;
  color: #222;
}

.container {
  width: 90%;
  max-width: 1100px;
  margin: auto;
}

header {
  background: #c1121f;
  color: white;
  padding: 20px 0;
}

header .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  font-size: 14px;
}

.hero {
  background: white;
  padding: 60px 0;
}

.hero-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 40px;
}

.hero-text h1 {
  font-size: 32px;
  margin-bottom: 15px;
}

.hero-text p {
  font-size: 16px;
  margin-bottom: 20px;
  color: #555;
}

.btn {
  display: inline-block;
  padding: 10px 20px;
  background: #f77f00;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-size: 14px;
}

.hero-img img {
  width: 350px;
  border-radius: 10px;
}

.products {
  padding: 60px 0;
  text-align: center;
}

.products h2 {
  font-size: 24px;
  margin-bottom: 40px;
}

.product-grid {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
}

.card {
  background: white;
  width: 220px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  border-radius: 8px;
  margin-bottom: 15px;
}

.card h3 {
  font-size: 16px;
  margin-bottom: 8px;
}

.price {
  color: #c1121f;
  font-weight: bold;
}

footer {
  background: #222;
  color: #aaa;
  text-align: center;
  padding: 20px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="logo">Warung Madura Bu Yuyun</div>
    <nav>
      <a href="#">Beranda</a>
      <a href="#">Produk</a>
      <a href="#">Kontak</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container hero-content">
    <div class="hero-text">
      <h1>Belanja Cepat, Murah, dan Lengkap</h1>
      <p>Kebutuhan harian tersedia 24 jam. Tanpa ribet, tanpa drama.</p>
      <a href="#" class="btn">Lihat Produk</a>
    </div>
    <div class="hero-img">
      <img src="hero.jpg" alt="Foto Warung">
    </div>
  </div>
</section>

<section class="products">
  <div class="container">
    <h2>Produk Favorit</h2>
    <div class="product-grid">

      <div class="card">
        <img src="produk1.jpg" alt="Produk 1">
        <h3>Indomie Goreng</h3>
        <div class="price">Rp3.000</div>
      </div>

      <div class="card">
        <img src="produk2.jpg" alt="Produk 2">
        <h3>Beras 5kg</h3>
        <div class="price">Rp65.000</div>
      </div>

      <div class="card">
        <img src="produk3.jpg" alt="Produk 3">
        <h3>Aqua 600ml</h3>
        <div class="price">Rp4.000</div>
      </div>

    </div>
  </div>
</section>

<footer>
  © 2026 Warung Madura Bu Yuyun • Buka 24 Jam
</footer>

</body>
</html>
